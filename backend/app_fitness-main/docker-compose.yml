# ============================================================================
# Docker Compose - Ecossistema Full Stack App Fitness
# ============================================================================
# Este arquivo orquestra a execução unificada do Banco de Dados PostgreSQL 16,
# da API Backend Java Spring Boot e do Frontend React Vite + Nginx.
#
# Para rodar toda a estrutura, execute na raiz do projeto:
# docker compose up -d --build

version: '3.8'

# ============================================================================
# SERVIÇOS
# ============================================================================
services:

  # ========================================================================
  # SERVIÇO 1: PostgreSQL (Banco de Dados)
  # ========================================================================
  postgres:
    # Utiliza a imagem oficial estável e leve do PostgreSQL 16 baseada em Alpine Linux
    image: postgres:16-alpine
    
    # Nome do container quando executado no Docker Desktop
    container_name: appfitness-postgres
    
    # Define a política de reinicialização automática (sempre reinicia exceto se parado manualmente)
    restart: always
    
    # Carrega as variáveis de ambiente sensíveis a partir do arquivo .env centralizado na raiz
    env_file:
      - .env
    
    # Mapeia as variáveis carregadas do .env para as configurações internas exigidas pelo Postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appfitness_db}
      POSTGRES_USER: ${POSTGRES_USER:-appfitness_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appfitness_secure_password_123}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:-"--encoding=UTF8 --locale=pt_BR.UTF-8"}
      TZ: America/Sao_Paulo
    
    # ====================================================================
    # VOLUMES - Persistência de Dados
    # ====================================================================
    volumes:
      # Mapeia o volume nomeado para proteger e persistir os dados da pós-graduação
      - postgres_data:/var/lib/postgresql/data
      # Volume para scripts de inicialização de tabelas e esquemas (se houver)
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    
    # ====================================================================
    # PORTAS - Mapeamento de Portas para acesso externo (ex: DBeaver, pgAdmin)
    # ====================================================================
    ports:
      - "5432:5432"
    
    # ====================================================================
    # HEALTHCHECK - Verificação de Integridade Crítica
    # ====================================================================
    # Testa ativamente se o banco já terminou de subir e está pronto para receber conexões.
    # Isso impede que o Spring Boot inicialize antes da hora e tome "Connection Refused".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appfitness_user} -d ${POSTGRES_DB:-appfitness_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    
    # Conecta o banco de dados à rede isolada interna do ecossistema Fitness
    networks:
      - appfitness-network

  # ========================================================================
  # SERVIÇO 2: Backend (API Java Spring Boot)
  # ========================================================================
  backend:
    # Constrói a imagem dinamicamente a partir do Dockerfile corrigido dentro da pasta backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    
    # Nome do container quando executado no Docker Desktop
    container_name: appfitness-backend
    
    # Reinicia automaticamente caso a aplicação falhe por alguma razão inesperada
    restart: always
    
    # Expõe a API do Spring Boot na porta padrão do host do desenvolvedor
    ports:
      - "8080:8080"
    
    # Carrega as credenciais e configurações de banco de dados diretamente do .env da raiz
    env_file:
      - .env
    
    # ====================================================================
    # CONTROLE DE SINCRONIZAÇÃO (DEPENDS_ON COM HEALTHCHECK)
    # ====================================================================
    # Sincronização definitiva: o contêiner do Java só sairá do estado de espera
    # quando o Healthcheck do PostgreSQL responder que está 100% "healthy" (saudável).
    depends_on:
      postgres:
        condition: service_healthy
    
    # Conecta o Backend à mesma rede para que consiga achar o banco usando o host 'postgres'
    networks:
      - appfitness-network

  # ========================================================================
  # SERVIÇO 3: Frontend (Interface React Vite + Servidor Nginx)
  # ========================================================================
  frontend:
    # Constrói a imagem do frontend a partir do diretório e Dockerfile específicos
    build:
      context: ./frontend
      dockerfile: Dockerfile
    
    # Nome do container quando executado no Docker Desktop
    container_name: appfitness-frontend
    
    # Reinicia automaticamente o servidor se houver oscilações
    restart: always
    
    # Mapeia a porta HTTP padrão (80) para você acessar apenas digitando http://localhost no navegador
    ports:
      - "80:80"
    
    # Injeta a URL da API capturada pelo arquivo .env para que o Axios saiba onde bater
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    
    # O Frontend aguarda o Backend estar de pé para garantir estabilidade no primeiro carregamento
    depends_on:
      - backend
    
    # Conecta à mesma rede compartilhada do ecossistema
    networks:
      - appfitness-network

# ============================================================================
# VOLUMES NOMEADOS
# ============================================================================
# Define e isola os volumes de armazenamento do Docker para não perder os dados salvos
volumes:
  postgres_data:
    driver: local

# ============================================================================
# REDES CUSTOMIZADAS (Isolamento de Infraestrutura)
# ============================================================================
# Cria uma rede bridge exclusiva. Os contêineres se comunicam por ela usando os nomes 
# dos serviços (o backend fala com 'postgres:5432' e o front fala com 'backend:8080')
networks:
  appfitness-network:
    driver: bridge

# ============================================================================
# MANUAL DE COMANDOS DE OPERAÇÃO
# ============================================================================
#
# 1. Iniciar toda a infraestrutura limpa e atualizada:
#    docker compose up -d --build
#
# 2. Derrubar e limpar os contêineres se houver travamento:
#    docker compose down
#
# 3. Inspecionar os logs em tempo real para auditoria do Spring Boot:
#    docker compose logs -f backend
#
# ============================================================================