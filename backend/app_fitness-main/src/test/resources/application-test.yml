spring:
  datasource:
    url: jdbc:h2:mem:appfitness_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

app:
  cors:
    allowed-origins: http://localhost:5173
  password-reset:
    frontend-url: http://localhost:5173/redefinir-senha
    from: no-reply@test.local
    mail-enabled: false
    mail-api-url: ""
    mail-api-key: ""

jwt:
  secret: test-only-secret-with-at-least-32-characters
  expiration: 3600000
  refresh-expiration: 7200000

gemini:
  api:
    key: ""

logging:
  level:
    root: WARN
    com.appfitness: WARN
    com.appfitness.security.JwtAuthenticationEntryPoint: ERROR
