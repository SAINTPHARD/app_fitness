spring.application.name=appfitness

server.port=8080

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/appfitness_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appfitness_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:appfitness_secure_password_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect