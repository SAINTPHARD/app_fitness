# ==================================================
# CONFIGURACOES GLOBAIS
# ==================================================
spring.application.name=appfitness

# Os caminhos file: sao relativos ao diretorio em que a JVM foi iniciada.
# A primeira entrada atende a execucao dentro do modulo; as demais atendem
# execucao pela raiz do repositorio e pela pasta backend, respectivamente.
spring.config.import=optional:file:.env[.properties],optional:file:backend/app_fitness-main/.env[.properties],optional:file:app_fitness-main/.env[.properties],optional:file:../../.env[.properties]

# Em arquivo .env, o nome em caixa alta nao recebe relaxed binding automatico.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Gemini (o modelo pode ser trocado sem recompilar quando um alias for descontinuado)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash-latest}

# Seguranca
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

#---
spring.config.activate.on-profile=dev

# ==================================================
# AMBIENTE DE DESENVOLVIMENTO
# Ativar com SPRING_PROFILES_ACTIVE=dev
# ==================================================
server.port=${PORT:8080}
logging.level.org.springframework=INFO
logging.level.com.appfitness=DEBUG

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appfitness_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#---
spring.config.activate.on-profile=prod

# ==================================================
# AMBIENTE DE PRODUCAO
# Ativar com SPRING_PROFILES_ACTIVE=prod
# ==================================================
server.port=${PORT:8080}
logging.level.root=WARN
logging.level.com.appfitness=INFO

server.error.include-message=always

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
