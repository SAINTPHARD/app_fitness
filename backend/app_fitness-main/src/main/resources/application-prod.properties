#==============================================
# SERVER & LOGS (PROD)
#=============================================
server.port=${PORT:8080}
logging.level.root=WARN
logging.level.com.appfitness=INFO

#==============================================
# DATABASE (PROD - Rigoroso)
#=============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#==============================================
# JPA / HIBERNATE (PROD)
# 'validate' nunca altera o banco em produção; garante integridade via migrations (Flyway/Liquibase)
#=============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#==============================================
# SECURITY & INTEGRATIONS (PROD - Sem Fallbacks)
#=============================================
# Sem valor padrão: se o JWT_SECRET não estiver injetado no servidor, a app falha ao iniciar.
jwt.secret=${0fpnazrhbt2rBa5F3Tn175nqrxfAEtrwy0S2VhQFUro8AyIqKXrPWkqKieSHOL+GRqgVg1BqsIrNKFb2Xw6YPQ==}
jwt.expiration=86400000

gemini.api.key=${SUA_CHAVE_AQUI_DE_API}