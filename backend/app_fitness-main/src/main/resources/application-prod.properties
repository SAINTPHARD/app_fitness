# Production profile
server.port=${PORT:8080}
logging.level.root=WARN
logging.level.com.appfitness=INFO

# PostgreSQL managed database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema changes; Hibernate only validates the final schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Frontend origins, comma-separated. Example: https://system-fitness.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Security and integrations: no production fallbacks.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
gemini.api.key=${GEMINI_API_KEY}

# Railway health check. Only health is exposed publicly by SecurityConfig.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
