#==============================================
# SERVER & LOGS (PROD)
#==============================================
server.port=${PORT:8080}
logging.level.root=WARN
logging.level.com.appfitness=INFO

#==============================================
# DATABASE (PROD - Rigoroso)
#==============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#==============================================
# JPA / HIBERNATE (PROD)
# 'validate' nunca altera o banco em produção; garante integridade via migrations (Flyway/Liquibase)
#==============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#==============================================
# SECURITY & INTEGRATIONS (PROD - Sem Fallbacks)
#==============================================
# CORREÇÃO: o valor literal do segredo estava dentro de "${...}" (Spring
# tentava resolver uma variável de ambiente cujo NOME era o próprio
# segredo, impossível de existir — e o segredo real ficava exposto em texto
# no arquivo). Sem valor padrão: se JWT_SECRET não estiver injetado no
# ambiente, a app falha ao iniciar — comportamento correto para prod.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

gemini.api.key=${GEMINI_API_KEY}
